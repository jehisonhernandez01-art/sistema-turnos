<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Turnos en Tiempo Real</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    h1 { text-align: center; }
    #login-container { text-align: center; margin-bottom: 20px; }
    input, button { padding: 10px; font-size: 16px; margin: 5px; }
    
    .panel-acciones { text-align: center; margin-bottom: 20px; display: none; }
    .btn-turno { background-color: #2ecc71; color: white; border: none; cursor: pointer; padding: 10px 20px; font-size: 18px; border-radius: 5px; }
    .btn-finalizado { background-color: #e74c3c; color: white; border: none; cursor: pointer; padding: 10px 20px; font-size: 18px; border-radius: 5px; }

    .tablero { display: flex; gap: 20px; justify-content: center; }
    .columna { flex: 1; max-width: 400px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); min-height: 300px; }
    .columna h2 { text-align: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
    
    .tarjeta-usuario { padding: 12px; margin: 10px 0; border-radius: 5px; color: white; font-weight: bold; text-align: center; font-size: 18px; }
  </style>
</head>
<body>

  <h1>Control de Turnos en Red Local</h1>

  <div id="login-container">
    <input type="text" id="nombreInput" placeholder="Ingresa tu nombre">
    <button onclick="ingresar()">Ingresar</button>
  </div>

  <div id="panelAcciones" class="panel-acciones">
    <p>Conectado como: <b id="usuarioActual"></b></p>
    <button class="btn-turno" onclick="iniciarTurno()">Turno</button>
    <button class="btn-finalizado" onclick="finalizarTurno()">Finalizado</button>
  </div>

  <div class="tablero">
    <div class="columna">
      <h2>En Turno (Izquierda)</h2>
      <div id="colIzquierda"></div>
    </div>
    <div class="columna">
      <h2>Sin Turno / Disponibles (Derecha)</h2>
      <div id="colDerecha"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let miNombre = localStorage.getItem('turno_usuario') || '';

    // Si el usuario ya se había registrado antes en esta PC, reconectar automáticamente
    socket.on('connect', () => {
      if (miNombre) {
        socket.emit('registrar-usuario', miNombre);
        mostrarPanelControl(miNombre);
      }
    });

    function ingresar() {
      const nombre = document.getElementById('nombreInput').value.trim();
      if (nombre) {
        miNombre = nombre;
        localStorage.setItem('turno_usuario', miNombre);
        socket.emit('registrar-usuario', miNombre);
        mostrarPanelControl(miNombre);
      }
    }

    function mostrarPanelControl(nombre) {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('panelAcciones').style.display = 'block';
      document.getElementById('usuarioActual').textContent = nombre;
    }

    function iniciarTurno() {
      socket.emit('iniciar-turno', miNombre);
    }

    function finalizarTurno() {
      socket.emit('finalizar-turno', miNombre);
    }

    socket.on('actualizar-lista', (usuarios) => {
      const colIzquierda = document.getElementById('colIzquierda');
      const colDerecha = document.getElementById('colDerecha');

      colIzquierda.innerHTML = '';
      colDerecha.innerHTML = '';

      Object.values(usuarios).forEach(user => {
        const tarjeta = document.createElement('div');
        tarjeta.className = 'tarjeta-usuario';
        tarjeta.style.backgroundColor = user.color;
        tarjeta.textContent = user.nombre;

        if (user.enTurno) {
          colIzquierda.appendChild(tarjeta);
        } else {
          colDerecha.appendChild(tarjeta);
        }
      });
    });
  </script>
</body>
</html>
