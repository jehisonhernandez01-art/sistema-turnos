<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Turnos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-container" class="card">
    <h2>Ingresar al Sistema</h2>
    <input type="text" id="username-input" placeholder="Escribe tu nombre..." />
    <button id="btn-join">Unirse</button>
  </div>

  <div id="app-container" class="hidden">
    <header class="header">
      <h1>Panel de Turnos</h1>
      <button id="btn-timeout" class="btn btn-warning">Tiempo Fuera</button>
    </header>

    <div id="turn-banner" class="banner hidden">
      <h2>¡Es tu Turno!</h2>
      <div class="turn-actions">
        <button id="btn-accept" class="btn btn-success">Tomar turno</button>
        <button id="btn-busy" class="btn btn-danger">
          Ocupado (<span id="timer-count">60</span>s)
        </button>
      </div>
    </div>

    <main class="users-grid" id="users-grid"></main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
