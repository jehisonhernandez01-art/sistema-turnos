<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Turnos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .hidden { display: none !important; }

    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }

    #login-container input {
      width: 100%;
      padding: 12px;
      margin: 16px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }

    #app-container {
      width: 100%;
      max-width: 900px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }
    .btn-success { background-color: #22c55e; color: #fff; }
    .btn-danger { background-color: #ef4444; color: #fff; }
    .btn-warning { background-color: #f59e0b; color: #fff; }
    .btn-warning.active { background-color: #d97706; border: 2px solid #fff; }
    .btn-kick { background-color: #dc2626; color: #fff; font-size: 0.8rem; margin-top: 8px; }

    .banner {
      background: #2563eb;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    .turn-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 12px;
    }

    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .user-card {
      position: relative;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .user-card.active-turn {
      border-color: #22c55e;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
    }

    .user-card.in-timeout {
      opacity: 0.5;
      border-color: #f59e0b;
    }

    /* Marca de agua para el contador diario */
    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.05);
      pointer-events: none;
      user-select: none;
    }

    .user-name {
      font-size: 1.2rem;
      font-weight: bold;
      z-index: 1;
    }

    .user-status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="login-container" class="card">
    <h2>Ingresar al Sistema</h2>
    <input type="text" id="username-input" placeholder="Escribe tu nombre..." />
    <button id="btn-join" class="btn btn-success">Unirse</button>
  </div>

  <div id="app-container" class="hidden">
    <header class="header">
      <h1>Panel de Turnos</h1>
      <button id="btn-timeout" class="btn btn-warning">Tiempo Fuera</button>
    </header>

    <div id="turn-banner" class="banner hidden">
      <h2>¡Es tu Turno!</h2>
      <div class="turn-actions">
        <button id="btn-accept" class="btn btn-success">Tomar turno</button>
        <button id="btn-busy" class="btn btn-danger">
          Ocupado (<span id="timer-count">60</span>s)
        </button>
      </div>
    </div>

    <main class="users-grid" id="users-grid"></main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const loginContainer = document.getElementById('login-container');
    const appContainer = document.getElementById('app-container');
    const usernameInput = document.getElementById('username-input');
    const btnJoin = document.getElementById('btn-join');
    const btnTimeout = document.getElementById('btn-timeout');
    const btnAccept = document.getElementById('btn-accept');
    const btnBusy = document.getElementById('btn-busy');
    const turnBanner = document.getElementById('turn-banner');
    const timerCount = document.getElementById('timer-count');
    const usersGrid = document.getElementById('users-grid');

    btnJoin.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      if (username) {
        socket.emit('joinRoom', username);
        loginContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
      }
    });

    btnAccept.addEventListener('click', () => socket.emit('acceptTurn'));
    btnBusy.addEventListener('click', () => socket.emit('busyTurn'));
    btnTimeout.addEventListener('click', () => socket.emit('toggleTimeout'));

    socket.on('turnTimerTick', ({ timeRemaining, userId }) => {
      if (userId === socket.id) {
        timerCount.textContent = timeRemaining;
      }
    });

    socket.on('stateUpdate', ({ users, userOrder, currentTurnIndex }) => {
      usersGrid.innerHTML = '';
      const me = users[socket.id];

      if (me) {
        if (me.isTimeout) {
          btnTimeout.classList.add('active');
          btnTimeout.textContent = 'En Tiempo Fuera';
        } else {
          btnTimeout.classList.remove('active');
          btnTimeout.textContent = 'Tiempo Fuera';
        }

        if (me.isTurn && !me.isTimeout) {
          turnBanner.classList.remove('hidden');
        } else {
          turnBanner.classList.add('hidden');
        }
      }

      userOrder.forEach((id) => {
        const user = users[id];
        if (!user) return;

        const card = document.createElement('div');
        card.className = `user-card ${user.isTurn ? 'active-turn' : ''} ${user.isTimeout ? 'in-timeout' : ''}`;

        // Marca de agua con el número de turnos de hoy
        const watermark = document.createElement('div');
        watermark.className = 'watermark';
        watermark.textContent = user.shiftsToday;

        const nameEl = document.createElement('div');
        nameEl.className = 'user-name';
        nameEl.textContent = user.name + (id === socket.id ? ' (Tú)' : '');

        const statusEl = document.createElement('div');
        statusEl.className = 'user-status';
        if (user.isTimeout) {
          statusEl.textContent = 'Tiempo Fuera';
        } else if (user.isTurn) {
          statusEl.textContent = 'En Turno';
        } else {
          statusEl.textContent = `Faltas seguidas: ${user.consecutiveMisses}`;
        }

        card.appendChild(watermark);
        card.appendChild(nameEl);
        card.appendChild(statusEl);

        // Habilitar botón KICK si tiene 2 o más faltas seguidas
        if (user.consecutiveMisses >= 2 && id !== socket.id) {
          const btnKick = document.createElement('button');
          btnKick.className = 'btn btn-kick';
          btnKick.textContent = 'KICK';
          btnKick.onclick = () => socket.emit('kickUser', id);
          card.appendChild(btnKick);
        }

        usersGrid.appendChild(card);
      });
    });

    socket.on('kicked', () => {
      alert('Has sido expulsado de la sala por no tomar 2 turnos consecutivos.');
      location.reload();
    });
  </script>
</body>
</html>
