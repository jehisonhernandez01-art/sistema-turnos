<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de Turnos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #1e272e; color: #fff; text-align: center; padding: 20px; padding-top: 80px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto 20px auto;
      padding-bottom: 10px;
      border-bottom: 1px solid #3d3d3d;
    }
    .header-botones-flotantes {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 10001;
      display: flex;
      gap: 10px;
      background: rgba(30, 39, 46, 0.9);
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
    }
    .btn-salir {
      background-color: #e67e22;
      color: white;
      border: none;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-salir:hover { background-color: #d35400; }
    .btn-salir:active { transform: scale(0.95); }
    .btn-reiniciar {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-reiniciar:hover { background-color: #ff6b81; }
    .btn-reiniciar:active { transform: scale(0.95); }
    
    /* Modal Registro */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-box {
      background: #2d3436; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
    }
    .modal-box input {
      width: 100%; padding: 12px; margin: 15px 0 10px 0; border-radius: 6px; border: none; font-size: 16px; outline: none;
    }
    .modal-box button {
      width: 100%; padding: 12px; border: none; color: #fff;
      font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 8px;
    }
    .btn-ingresar { background: #00cec9; }
    .btn-solo-vista { background: #0984e3; }
    
    /* Notificación Emergente Gigante de Turno Activo */
    .modal-turno-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(46, 204, 113, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: pulsoFondo 1.5s infinite alternate;
    }
    @keyframes pulsoFondo {
      0% { background: rgba(46, 204, 113, 0.92); }
      100% { background: rgba(39, 174, 96, 0.98); }
    }
    .modal-turno-box {
      background: #ffffff;
      color: #2c3e50;
      padding: 40px;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }
    .modal-turno-box h2 {
      font-size: 32px;
      color: #27ae60;
      margin-bottom: 5px;
    }
    .modal-turno-box p {
      font-size: 18px;
      color: #555;
      margin-bottom: 20px;
    }
    #btnEnTurno {
      background: #27ae60;
      color: #ffffff;
      border: none;
      padding: 16px 25px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
      transition: transform 0.1s;
    }
    #btnEnTurno:active { transform: scale(0.96); }
    #btnOcupado {
      background: #e67e22;
      color: #ffffff;
      border: none;
      padding: 16px 25px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4);
      transition: transform 0.1s;
    }
    #btnOcupado:active { transform: scale(0.96); }

    /* Ruleta */
    .ruleta-container {
      position: relative; width: 360px; height: 360px; margin: 20px auto;
    }
    .flecha-indicadora {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 30px solid #e74c3c;
      z-index: 10;
    }
    canvas {
      width: 100%; height: 100%; border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <!-- Botones Flotantes -->
  <div class="header-botones-flotantes">
    <button id="btnTiempoFuera" class="btn-salir" style="display: none; background-color: #f39c12;">⏱️ Tiempo Fuera</button>
    <button id="btnSalirTurno" class="btn-salir" style="display: none;">Finalizar Conexión</button>
    <button id="btnReiniciarGeneral" class="btn-reiniciar">Reiniciar Usuarios</button>
  </div>

  <!-- Modal Registro -->
  <div id="modalLogin" class="modal-overlay">
    <div class="modal-box">
      <h2>Asignación de PC</h2>
      <p style="margin-top: 5px; color: #b2bec3;">Ingresa tu nombre para identificarte en el sistema</p>
      <input type="text" id="inputNombre" placeholder="Tu nombre..." autocomplete="off">
      <button id="btnIngresar" class="btn-ingresar">Entrar al Sistema</button>
      <hr style="border: 0; border-top: 1px solid #636e72; margin: 15px 0;">
      <button id="btnSoloVista" class="btn-solo-vista">👁️ Acceder en Solo Vista</button>
    </div>
  </div>

  <!-- Modal Turno Emergente -->
  <div id="modalTurnoEmergente" class="modal-turno-overlay">
    <div class="modal-turno-box">
      <h2 id="tituloModalTurno">¡ES TU TURNO!</h2>
      <h1 id="nombreTurnoActual" style="
        font-size: 38px; color: #2c3e50; background: #f1c40f; padding: 12px 20px;
        border-radius: 10px; margin: 15px 0; word-break: break-word; text-transform: uppercase;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      "></h1>
      <p id="descripcionModalTurno">Tienes la atención asignada con el Técnico.</p>
      
      <!-- Contador Regresivo -->
      <div id="contenedorTimer" style="font-size: 22px; font-weight: bold; color: #e74c3c; margin-bottom: 15px;">
        Cambio automático en: <span id="contadorSegundos">60</span>s
      </div>

      <div style="display: flex; gap: 10px; justify-content: center;">
        <button id="btnEnTurno">Tomar Turno</button>
        <button id="btnOcupado">Ocupado</button>
      </div>
    </div>
  </div>

  <header>
    <div>
      <h1 style="font-size: 22px;">Ruleta de Turnos</h1>
      <p id="infoUsuario" style="color: #00cec9; text-align: left; font-size: 14px; margin-top: 3px;"></p>
    </div>
  </header>

  <div class="ruleta-container">
    <div class="flecha-indicadora"></div>
    <canvas id="canvasRuleta" width="400" height="400"></canvas>
  </div>

  <!-- Lista de Usuarios y Botón Kick -->
  <div id="listaUsuariosKick" style="max-width: 450px; margin: 25px auto; text-align: left;"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('canvasRuleta');
    const ctx = canvas.getContext('2d');
    const modalLogin = document.getElementById('modalLogin');
    const inputNombre = document.getElementById('inputNombre');
    const btnIngresar = document.getElementById('btnIngresar');
    const btnSoloVista = document.getElementById('btnSoloVista');
    const infoUsuario = document.getElementById('infoUsuario');
    const modalTurnoEmergente = document.getElementById('modalTurnoEmergente');
    const nombreTurnoActual = document.getElementById('nombreTurnoActual');
    const tituloModalTurno = document.getElementById('tituloModalTurno');
    const descripcionModalTurno = document.getElementById('descripcionModalTurno');
    const btnEnTurno = document.getElementById('btnEnTurno');
    const btnOcupado = document.getElementById('btnOcupado');
    const btnSalirTurno = document.getElementById('btnSalirTurno');
    const btnReiniciarGeneral = document.getElementById('btnReiniciarGeneral');
    const btnTiempoFuera = document.getElementById('btnTiempoFuera');
    const contadorSegundos = document.getElementById('contadorSegundos');
    const contenedorTimer = document.getElementById('contenedorTimer');
    const listaUsuariosKick = document.getElementById('listaUsuariosKick');

    let miClave = localStorage.getItem('ruleta_clave_pc') || '';
    let miNombre = localStorage.getItem('ruleta_nombre_pc') || '';
    let esSoloVista = localStorage.getItem('ruleta_solo_vista') === 'true';
    
    let contadorIntervalo = null;
    let segundosRestantes = 60;
    let usuariosInactivosList = JSON.parse(localStorage.getItem('ruleta_inactivos') || '{}');

    function registrar(nombre) {
      socket.emit('registrar-usuario', nombre, (res) => {
        if (res && res.exito) {
          miClave = res.usuario.clave;
          miNombre = res.usuario.nombre;
          esSoloVista = false;
          localStorage.setItem('ruleta_clave_pc', miClave);
          localStorage.setItem('ruleta_nombre_pc', miNombre);
          localStorage.removeItem('ruleta_solo_vista');
          modalLogin.style.display = 'none';
          btnSalirTurno.style.display = 'inline-block';
          btnTiempoFuera.style.display = 'inline-block';
          infoUsuario.textContent = `PC asignada a: ${miNombre}`;
        }
      });
    }

    function activarSoloVista() {
      esSoloVista = true;
      miClave = '';
      miNombre = '';
      localStorage.removeItem('ruleta_clave_pc');
      localStorage.removeItem('ruleta_nombre_pc');
      localStorage.setItem('ruleta_solo_vista', 'true');
      modalLogin.style.display = 'none';
      btnSalirTurno.style.display = 'none';
      btnTiempoFuera.style.display = 'none';
      infoUsuario.textContent = `Modo: Solo Vista (Monitor Central)`;
      infoUsuario.style.color = '#0984e3';
    }

    if (esSoloVista) {
      activarSoloVista();
    } else if (miNombre) {
      registrar(miNombre);
    }

    btnIngresar.addEventListener('click', () => {
      const val = inputNombre.value.trim();
      if (val) registrar(val);
    });

    btnSoloVista.addEventListener('click', () => {
      activarSoloVista();
    });

    btnTiempoFuera.addEventListener('click', () => {
      socket.emit('toggle-tiempo-fuera', miClave);
    });

    function iniciarCuentaRegresiva(claveUsuarioActual) {
      detenerCuentaRegresiva();
      segundosRestantes = 60;
      contadorSegundos.textContent = segundosRestantes;
      contenedorTimer.style.display = 'block';

      contadorIntervalo = setInterval(() => {
        segundosRestantes--;
        contadorSegundos.textContent = segundosRestantes;

        if (segundosRestantes <= 0) {
          detenerCuentaRegresiva();
          usuariosInactivosList[claveUsuarioActual] = true;
          localStorage.setItem('ruleta_inactivos', JSON.stringify(usuariosInactivosList));
          socket.emit('siguiente-turno');
        }
      }, 1000);
    }

    function detenerCuentaRegresiva() {
      if (contadorIntervalo) {
        clearInterval(contadorIntervalo);
        contadorIntervalo = null;
      }
    }

    btnEnTurno.addEventListener('click', () => {
      detenerCuentaRegresiva();
      if (miClave && usuariosInactivosList[miClave]) {
        delete usuariosInactivosList[miClave];
        localStorage.setItem('ruleta_inactivos', JSON.stringify(usuariosInactivosList));
      }
      socket.emit('siguiente-turno');
    });

    btnOcupado.addEventListener('click', () => {
      detenerCuentaRegresiva();
      socket.emit('siguiente-turno');
    });

    btnSalirTurno.addEventListener('click', () => {
      if (confirm('¿Estás seguro de que deseas salir de la lista de turnos?')) {
        socket.emit('finalizar-conexion', miClave, (respuesta) => {
          if (respuesta && respuesta.exito) {
            localStorage.clear();
            location.reload();
          } else {
            alert(respuesta.mensaje || 'Error al intentar salir.');
          }
        });
      }
    });

    btnReiniciarGeneral.addEventListener('click', () => {
      const password = prompt('🔐 Ingresa la contraseña de administrador para borrar todos los usuarios:');
      if (password) {
        socket.emit('reiniciar-sistema', password, (respuesta) => {
          if (respuesta && respuesta.exito) {
            alert(respuesta.mensaje);
            localStorage.clear();
            location.reload();
          } else {
            alert(respuesta.mensaje || 'Error al intentar reiniciar.');
          }
        });
      }
    });

    socket.on('actualizar-ruleta', (usuarios) => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const total = usuarios.length;

      // Filtrar los usuarios que están en Tiempo Fuera
      const usuariosActivos = usuarios.filter(u => !u.enTiempoFuera);
      const primerUsuario = usuariosActivos.length > 0 ? usuariosActivos[0] : null;

      // Botón Tiempo Fuera
      const miUsuarioObj = usuarios.find(u => u.clave === miClave);
      if (miUsuarioObj) {
        btnTiempoFuera.textContent = miUsuarioObj.enTiempoFuera ? '▶️ Volver al Turno' : '⏱️ Tiempo Fuera';
        btnTiempoFuera.style.backgroundColor = miUsuarioObj.enTiempoFuera ? '#2ecc71' : '#f39c12';
      }

      if (total === 0) {
        modalTurnoEmergente.style.display = 'none';
        detenerCuentaRegresiva();
        listaUsuariosKick.innerHTML = '';
        return;
      }

      // Dibujar Canvas
      const centroX = canvas.width / 2;
      const centroY = canvas.height / 2;
      const radio = canvas.width / 2;
      const anguloPorSector = (2 * Math.PI) / total;
      const offset = -Math.PI / 2 - (anguloPorSector / 2);

      usuarios.forEach((u, index) => {
        const inicio = offset + (index * anguloPorSector);
        const fin = inicio + anguloPorSector;

        ctx.beginPath();
        ctx.moveTo(centroX, centroY);
        ctx.arc(centroX, centroY, radio, inicio, fin);
        ctx.closePath();
        ctx.fillStyle = u.enTiempoFuera ? '#7f8c8d' : u.color;
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(centroX, centroY);
        ctx.rotate(inicio + anguloPorSector / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 18px Segoe UI";
        ctx.fillText(u.nombre + (u.enTiempoFuera ? ' (PAUSA)' : ''), radio - 20, 6);
        ctx.restore();
      });

      // Lista de usuarios y botón Kick
      listaUsuariosKick.innerHTML = '<h3 style="margin-bottom:10px; text-align:center;">Participantes</h3>';
      usuarios.forEach(u => {
        const esInactivo = usuariosInactivosList[u.clave];
        const item = document.createElement('div');
        item.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 12px; margin-bottom:5px; background:#2d3436; border-radius:6px;';
        
        let html = `<span><strong style="color:${u.color}">● ${u.nombre}</strong> ${u.enTiempoFuera ? '<i>(Tiempo Fuera)</i>' : ''}</span>`;
        
        if (esInactivo && u.clave !== miClave) {
          html += `<button onclick="expulsar('${u.clave}')" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">Kick 🚫</button>`;
        }
        
        item.innerHTML = html;
        listaUsuariosKick.appendChild(item);
      });

      // Visibilidad del Modal Emergente
      if (esSoloVista) {
        if (primerUsuario) {
          tituloModalTurno.textContent = "TURNO ACTUAL";
          nombreTurnoActual.textContent = primerUsuario.nombre;
          descripcionModalTurno.textContent = "Atención asignada actualmente con el Técnico.";
          btnEnTurno.style.display = "none";
          btnOcupado.style.display = "none";
          contenedorTimer.style.display = "none";
          modalTurnoEmergente.style.display = 'flex';
        } else {
          modalTurnoEmergente.style.display = 'none';
        }
      } else {
        btnEnTurno.style.display = "inline-block";
        btnOcupado.style.display = "inline-block";
        tituloModalTurno.textContent = "¡ES TU TURNO!";
        descripcionModalTurno.textContent = "Tienes la atención asignada con el Técnico. Haz clic para confirmar o indicar que estás ocupado.";

        if (miClave && primerUsuario && primerUsuario.clave === miClave) {
          nombreTurnoActual.textContent = primerUsuario.nombre;
          modalTurnoEmergente.style.display = 'flex';
          
          if (!contadorIntervalo) {
            iniciarCuentaRegresiva(primerUsuario.clave);
          }
        } else {
          detenerCuentaRegresiva();
          modalTurnoEmergente.style.display = 'none';
        }
      }
    });

    window.expulsar = function(claveUsuario) {
      if (confirm('¿Deseas expulsar a este usuario inactivo del sistema?')) {
        socket.emit('expulsar-usuario', claveUsuario, () => {
          delete usuariosInactivosList[claveUsuario];
          localStorage.setItem('ruleta_inactivos', JSON.stringify(usuariosInactivosList));
        });
      }
    };
  </script>
</body>
</html>
