<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Turnos en Tiempo Real</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #login-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .main-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            gap: 20px;
            display: none; /* Oculto hasta iniciar sesión */
        }
        .column {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            min-height: 400px;
        }
        .column h3 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .user-card {
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #btn-turno { background-color: #28a745; color: white; }
        #btn-finalizado { background-color: #dc3545; color: white; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h2>Gestión de Turnos Compartida</h2>

    <div id="login-container">
        <h3>Regístrate para participar</h3>
        <input type="text" id="nombreInput" placeholder="Tu nombre" required>
        <label for="colorInput">Color:</label>
        <input type="color" id="colorInput" value="#3498db">
        <button onclick="registrar()">Entrar</button>
    </div>

    <div class="main-container" id="app-container">
        <div class="column">
            <h3>En Turno</h3>
            <div id="columna-turno"></div>
            <div class="controls">
                <button id="btn-turno" onclick="darTurno()">Pedir Turno</button>
                <button id="btn-finalizado" onclick="finalizarTurno()">Finalizar</button>
            </div>
        </div>

        <div class="column">
            <h3>Espera y Finalizados</h3>
            <div id="columna-espera"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function registrar() {
            const nombre = document.getElementById('nombreInput').value.trim();
            const color = document.getElementById('colorInput').value;

            if (!nombre) {
                alert("Por favor ingresa tu nombre");
                return;
            }

            socket.emit('registrar_usuario', { nombre, color });

            document.getElementById('login-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
        }

        function darTurno() {
            socket.emit('dar_turno');
        }

        function finalizarTurno() {
            socket.emit('finalizar_turno');
        }

        // Escuchar actualizaciones del servidor
        socket.on('actualizar_usuarios', (usuarios) => {
            const colTurno = document.getElementById('columna-turno');
            const colEspera = document.getElementById('columna-espera');

            colTurno.innerHTML = '';
            colEspera.innerHTML = '';

            usuarios.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-card';
                div.style.backgroundColor = user.color;
                div.textContent = user.nombre;

                if (user.estado === 'turno') {
                    colTurno.appendChild(div);
                } else {
                    // Si está en espera o finalizado va a la columna derecha
                    colEspera.appendChild(div);
                }
            });
        });
    </script>
</body>
</html>
