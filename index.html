<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de Turnos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #1e272e; color: #fff; text-align: center; padding: 20px; }

    /* Modal Registro */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-box {
      background: #2d3436; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px;
    }
    .modal-box input {
      width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: none; font-size: 16px;
    }
    .modal-box button {
      width: 100%; padding: 12px; background: #00cec9; border: none; color: #fff;
      font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px;
    }

    /* Contenedor Ruleta */
    .ruleta-container {
      position: relative; width: 360px; height: 360px; margin: 30px auto;
    }
    /* Flecha superior fija apuntando abajo */
    .flecha-indicadora {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 30px solid #e74c3c;
      z-index: 10;
    }
    canvas {
      width: 100%; height: 100%; border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      transition: transform 1s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    /* Notificación de Turno */
    #notificacionTurno {
      display: none; background: #2ecc71; padding: 20px; border-radius: 10px;
      max-width: 400px; margin: 20px auto; box-shadow: 0 4px 15px rgba(46,204,113,0.4);
    }
    #notificacionTurno h2 { margin-bottom: 10px; }
    #btnEnTurno {
      background: #ffffff; color: #27ae60; border: none; padding: 12px 25px;
      font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px;
    }

    /* Botón Invisible */
    #btnResetInvisible {
      position: fixed; top: 0; right: 0; width: 30px; height: 30px;
      background: transparent; border: none; opacity: 0; cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="btnResetInvisible"></button>

  <div id="modalLogin" class="modal-overlay">
    <div class="modal-box">
      <h2>Asignación de PC</h2>
      <p>Ingresa tu nombre para entrar a la ruleta</p>
      <input type="text" id="inputNombre" placeholder="Tu nombre..." autocomplete="off">
      <button id="btnIngresar">Entrar</button>
    </div>
  </div>

  <h1 style="margin-top: 10px;">Sistema de Turnos - Ruleta</h1>
  <p id="infoUsuario" style="color: #00cec9; margin-top: 5px;"></p>

  <!-- Notificación activa solo para el usuario en turno -->
  <div id="notificacionTurno">
    <h2>¡Turno con Técnico!</h2>
    <p>Haz clic para confirmar e iniciar tu atención.</p>
    <button id="btnEnTurno">En Turno</button>
  </div>

  <div class="ruleta-container">
    <div class="flecha-indicadora"></div>
    <canvas id="canvasRuleta" width="400" height="400"></canvas>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const canvas = document.getElementById('canvasRuleta');
    const ctx = canvas.getContext('2d');
    const modalLogin = document.getElementById('modalLogin');
    const inputNombre = document.getElementById('inputNombre');
    const btnIngresar = document.getElementById('btnIngresar');
    const infoUsuario = document.getElementById('infoUsuario');
    const notificacionTurno = document.getElementById('notificacionTurno');
    const btnEnTurno = document.getElementById('btnEnTurno');
    const btnResetInvisible = document.getElementById('btnResetInvisible');

    let miClave = localStorage.getItem('ruleta_clave_pc') || '';
    let miNombre = localStorage.getItem('ruleta_nombre_pc') || '';

    function registrar(nombre) {
      socket.emit('registrar-usuario', nombre, (res) => {
        if (res && res.exito) {
          miClave = res.usuario.clave;
          miNombre = res.usuario.nombre;
          localStorage.setItem('ruleta_clave_pc', miClave);
          localStorage.setItem('ruleta_nombre_pc', miNombre);
          modalLogin.style.display = 'none';
          infoUsuario.textContent = `PC asignada a: ${miNombre}`;
        }
      });
    }

    if (miNombre) registrar(miNombre);

    btnIngresar.addEventListener('click', () => {
      const val = inputNombre.value.trim();
      if (val) registrar(val);
    });

    btnEnTurno.addEventListener('click', () => {
      socket.emit('siguiente-turno');
    });

    btnResetInvisible.addEventListener('click', () => {
      if (confirm('¿Reiniciar ruleta y borrar todos los registros?')) {
        socket.emit('reiniciar-sistema');
        localStorage.clear();
        location.reload();
      }
    });

    // Dibujar la ruleta
    socket.on('actualizar-ruleta', (usuarios) => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const total = usuarios.length;

      if (total === 0) {
        notificacionTurno.style.display = 'none';
        return;
      }

      const centroX = canvas.width / 2;
      const centroY = canvas.height / 2;
      const radio = canvas.width / 2;
      const anguloPorSector = (2 * Math.PI) / total;

      // Dibujar sectores
      // Desplazamos -Math.PI/2 para que el índice 0 empiece arriba donde está la flecha
      usuarios.forEach((u, index) => {
        const inicio = -Math.PI / 2 + (index * anguloPorSector);
        const fin = inicio + anguloPorSector;

        ctx.beginPath();
        ctx.moveTo(centroX, centroY);
        ctx.arc(centroX, centroY, radio, inicio, fin);
        ctx.closePath();
        ctx.fillStyle = u.color;
        ctx.fill();
        ctx.stroke();

        // Texto del nombre
        ctx.save();
        ctx.translate(centroX, centroY);
        ctx.rotate(inicio + anguloPorSector / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 18px Segoe UI";
        ctx.fillText(u.nombre, radio - 20, 5);
        ctx.restore();
      });

      // Verificar si ESTA PC es la elegida (primer elemento de la lista)
      const primerUsuario = usuarios[0];
      if (miClave && primerUsuario && primerUsuario.clave === miClave) {
        notificacionTurno.style.display = 'block';
      } else {
        notificacionTurno.style.display = 'none';
      }
    });
  </script>
</body>
</html>
